name: pin_zap
description: PinZap - Avalie. Marque. Zap!
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Estado
  provider: 6.1.5+1
  # Firebase
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.3
  # Utilitários
  shared_preferences: 2.5.3
  image_picker: 1.1.2
  image_cropper: 9.1.0
  uuid: 4.5.1
  intl: 0.19.0
  path_provider: 2.1.5
  cupertino_icons: ^1.0.8
  google_fonts: 6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
