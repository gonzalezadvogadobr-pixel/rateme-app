<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RateMe - Avalie fotos com pinos interativos">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RateMe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>RateMe</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- IndexedDB helper – permite armazenar imagens grandes sem limite do localStorage -->
  <script>
    (function() {
      const DB_NAME = 'rateme_images';
      const DB_VERSION = 1;
      const STORE = 'images';

      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = e => {
            e.target.result.createObjectStore(STORE);
          };
          req.onsuccess = e => resolve(e.target.result);
          req.onerror   = e => reject(e.target.error);
        });
      }

      // Salva imagem (base64 string) com uma chave
      window.idbSaveImage = function(key, base64) {
        return openDB().then(db => new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, 'readwrite');
          tx.objectStore(STORE).put(base64, key);
          tx.oncomplete = () => resolve(true);
          tx.onerror    = e => reject(e.target.error);
        }));
      };

      // Carrega imagem por chave; retorna null se não existir
      window.idbLoadImage = function(key) {
        return openDB().then(db => new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, 'readonly');
          const req = tx.objectStore(STORE).get(key);
          req.onsuccess = e => resolve(e.target.result || null);
          req.onerror   = e => reject(e.target.error);
        }));
      };

      // Remove imagem por chave
      window.idbDeleteImage = function(key) {
        return openDB().then(db => new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, 'readwrite');
          tx.objectStore(STORE).delete(key);
          tx.oncomplete = () => resolve(true);
          tx.onerror    = e => reject(e.target.error);
        }));
      };

      // Carrega todas as chaves do store
      window.idbGetAllKeys = function() {
        return openDB().then(db => new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, 'readonly');
          const req = tx.objectStore(STORE).getAllKeys();
          req.onsuccess = e => resolve(e.target.result);
          req.onerror   = e => reject(e.target.error);
        }));
      };

      console.log('[RateMe] IndexedDB helpers registrados.');
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
